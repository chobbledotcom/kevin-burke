---
layout: base.html
css: page
---

<article>
  {% if image %}
  <figure class="page-hero">
    <img src="{{ image }}" alt="{{ image_alt }}" width="420" height="420">
  </figure>
  {% endif %}
  {{ content }}
</article>

{% for testimonial in testimonials %}
<blockquote>
  &#8220;{{ testimonial.text }}&#8221;
  <footer>
    <a rel="nofollow" href="{{ testimonial.url }}"> {{ testimonial.name }} </a>
  </footer>
</blockquote>
{% endfor %}

<article>{% include "cta.html" %}</article>
